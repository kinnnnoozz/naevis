<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving GIF with p5.js</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>

    <script>
        let x, y;
        let speedX, speedY;
        let maxSpeed = 5; 
        let img; 
        let img2;
        let s = 100; 
        let isVisible = true; 

        function preload() {
            img = loadImage('memory2_f.gif'); 
            img2 = loadImage('img.jpg'); 
        }

        function setup() {
            createCanvas(800, 400); 
            x = random(width - s);
            y = random(height - s);
            speedX = random(-maxSpeed, maxSpeed);
            speedY = random(-maxSpeed, maxSpeed);
        }

        function draw() {
            
            image(img2, 0, 0, width, height);
            if (isVisible) {
                image(img, x, y, s, s);

         
                x += speedX;
                y += speedY;

               
                if (x <= 0 || x >= width - s) {
                    speedX *= -1;
                }
                if (y <= 0 || y >= height - s) {
                    speedY *= -1;
                }

          
                speedX += random(-0.1, 0.1);
                speedY += random(-0.1, 0.1);
                speedX = constrain(speedX, -maxSpeed, maxSpeed);
                speedY = constrain(speedY, -maxSpeed, maxSpeed);
            }
        }

        function mousePressed() {
    
            if (isVisible && mouseX >= x && mouseX <= x + s && mouseY >= y && mouseY <= y + s) {
                isVisible = false; 
            }
        }
    </script>

</body>
</html>
